name: CI

# Build + test on every push and pull request to main (review finding M21). Also builds the framework-dependent MSI,
# unsigned, so a broken installer is caught before a release tag. Releases are built by release.yml.
#
# Restores run in NuGet locked mode (Directory.Build.props sets RestoreLockedMode when GITHUB_ACTIONS=true): a package
# that is not in a committed packages.lock.json fails the build. After changing a PackageReference, run
# "dotnet restore winsmtprelay.slnx --force-evaluate" locally and commit the changed lock files.
#
# Third-party actions are pinned to full commit SHAs (the comment names the release).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore (locked)
        run: dotnet restore winsmtprelay.slnx

      - name: Build
        run: dotnet build winsmtprelay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test winsmtprelay.slnx --no-build --configuration Release --verbosity normal

      # Installer smoke build (framework-dependent, unsigned): proves the WiX sources, the custom actions and the
      # harvest still fit together.
      - name: Publish Service (framework-dependent)
        run: >
          dotnet publish src/WinSmtpRelay.Service/WinSmtpRelay.Service.csproj
          -c Release -r win-x64 --self-contained false
          -o ${{ github.workspace }}/publish-fd/

      - name: Build MSI (framework-dependent, unsigned)
        shell: pwsh
        run: >
          dotnet build setup/WinSmtpRelay.Setup/WinSmtpRelay.Setup.wixproj
          -c Release
          -p:HarvestPath=${{ github.workspace }}\publish-fd\
          -p:SelfContained=false
