name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job may write Pages (and needs the OIDC token for it).
# Third-party actions are pinned to full commit SHAs (the comment names the release).
permissions:
  contents: read

# Allow only one concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # windows-latest matches the release CI and avoids cross-platform restore surprises (the solution
    # also contains a net10.0-windows host and a WiX installer project). DocFX only reads the net10.0
    # library projects listed in docs/docfx.json.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      # DocFX needs the project references resolved before extracting API metadata. Locked mode (lock files).
      - name: Restore
        run: dotnet restore winsmtprelay.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Build documentation site
        run: dotnet docfx docs/docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
